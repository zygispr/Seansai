name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Constitution Quality Standards: no known critical vulnerabilities in runtime dependencies.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm test
      - run: npm run test:load
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  # Self-hosting must keep working (002 FR-015). The saved fixtures are mounted, not in the image,
  # so the refresh writes real data and CI never contacts a cinema.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: docker build -t seansai .

      - name: Serves data and the web app, also after a restart on the same volume
        run: |
          docker run --detach --name seansai --publish 3000:3000 \
            --volume seansai-data:/data \
            --volume "$PWD/apps/api/tests/fixtures:/app/apps/api/tests/fixtures:ro" \
            --env SOURCES_MODE=fixtures seansai
          check() {
            for attempt in $(seq 1 30); do
              curl --silent --fail 'http://localhost:3000/api/v1/movies?city=all' \
                | grep --quiet '"movies":\[{' && break
              if [ "$attempt" = 30 ]; then echo 'The movie list stayed empty'; exit 1; fi
              sleep 2
            done
            curl --silent --show-error --fail http://localhost:3000/api/v1/health \
              | grep --quiet '"status":"ok"'
            curl --silent --show-error --fail http://localhost:3000/ | grep --quiet 'id="root"'
            curl --silent --show-error --fail http://localhost:3000/lt/vilnius \
              | grep --quiet 'id="root"'
          }
          check
          docker restart seansai
          check

      - if: failure()
        run: docker logs seansai
